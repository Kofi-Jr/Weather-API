spring.application.name=weather-api

# Database connection. Configure with environment variables; the defaults are
# for local development only and no password is stored in this file.
# Example: DB_URL=jdbc:mysql://localhost:3306/weather_db DB_USER=root DB_PASSWORD=secret
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/weather_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Create/update the schema automatically from the JPA entities.
spring.jpa.hibernate.ddl-auto=update
# Show SQL in the logs while developing (set to false in production).
spring.jpa.show-sql=true
